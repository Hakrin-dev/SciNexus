[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-agents"
version = "0.1.0"
description = "基于 LangGraph 的学术多智能体工作台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.40,<2",
    "httpx>=0.27,<1",
    "certifi>=2024.7.4",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
academic-agents = "academic_agents.__main__:main"

[tool.setuptools.packages.find]
include = ["academic_agents*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
norecursedirs = [".venv", ".pytest_cache", "work", "data"]
